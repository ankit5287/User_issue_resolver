<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Issue Resolver Support Portal</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0F0F1A;
      color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .landing-header {
      padding-top: 120px;
      padding-bottom: 40px;
    }
    .apple-card {
      background-color: #16162A;
      border-radius: 20px;
      border: 1px solid #1E1E3A;
      box-shadow: none;
      padding: 40px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .apple-card:hover {
      transform: translateY(-2px);
      border-color: #5DADE2;
    }
    .btn-apple-blue {
      background-color: #5DADE2;
      color: #FFFFFF;
      border-radius: 9999px;
      font-weight: 500;
      padding: 10px 24px;
      font-size: 14px;
      border: none;
      transition: background-color 0.15s ease;
    }
    .btn-apple-blue:hover {
      background-color: #85C1E9;
      color: #FFFFFF;
    }
    .btn-apple-dark {
      background-color: #2A2A4A;
      color: #FFFFFF;
      border-radius: 9999px;
      font-weight: 500;
      padding: 10px 24px;
      font-size: 14px;
      border: 1px solid #3A3A5A;
      transition: background-color 0.15s ease;
    }
    .btn-apple-dark:hover {
      background-color: #1E1E3A;
      color: #FFFFFF;
    }
  </style>
</head>
<body class="d-flex flex-column justify-content-between min-vh-100">

  <!-- Header Section -->
  <header class="container text-center landing-header">
    <h1 class="display-3 fw-bold tracking-tight mb-2" style="font-size: 48px; color: #FFFFFF; letter-spacing: -1px;">User Issue Resolver</h1>
    <p class="lead" style="font-size: 21px; color: #8B8B9A; font-weight: 400; letter-spacing: -0.5px;">Intelligent Support. Simplified.</p>
  </header>

  <!-- Main Cards Section -->
  <main class="container">
    <div class="row justify-content-center gap-4 px-3">
      
      <!-- User Card -->
      <div class="card apple-card col-md-5 border-0 text-center flex-column justify-content-between">
        <div class="card-body p-0">
          <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-4" style="width: 72px; height: 72px; color: #5DADE2; background-color: #1E2A3A;">
            <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <h3 class="card-title fw-bold mb-2" style="font-size: 20px; color: #FFFFFF;">User Portal</h3>
          <p class="card-text mb-4" style="font-size: 14px; color: #8B8B9A; line-height: 1.5;">Submit and track your support requests</p>
        </div>
        <div class="p-0">
          <a href="{% url 'user_portal' %}" class="btn btn-apple-blue w-100 text-decoration-none d-block">
            Get Started
          </a>
        </div>
      </div>

      <!-- Developer Card -->
      <div class="card apple-card col-md-5 border-0 text-center flex-column justify-content-between">
        <div class="card-body p-0">
          <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-4" style="width: 72px; height: 72px; color: #8B8B9A; background-color: #2A2A4A;">
            <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2z"></path>
            </svg>
          </div>
          <h3 class="card-title fw-bold mb-2" style="font-size: 20px; color: #FFFFFF;">Developer Dashboard</h3>
          <p class="card-text mb-4" style="font-size: 14px; color: #8B8B9A; line-height: 1.5;">Manage, prioritize, and resolve issues</p>
        </div>
        <div class="p-0">
          <a href="{% url 'developer_dashboard' %}" class="btn btn-apple-dark w-100 text-decoration-none d-block">
            Open Dashboard
          </a>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer Section -->
  <footer class="text-center py-5">
    <span class="small" style="color: #8B8B9A;">&copy; 2026 User Issue Resolver</span>
  </footer>

</body>
</html>
